name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # SonarQube needs full history for blame data

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # same as the Dockerfile
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (settings in .flake8)
        run: flake8

      - name: Test with coverage (settings in pyproject.toml)
        run: |
          coverage run -m pytest
          coverage report
          coverage xml

      - name: SonarQube scan
        # Skipped until a SONAR_TOKEN secret is configured for this repo
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
